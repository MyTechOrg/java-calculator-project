name: Docker Compose Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Verify Docker Compose Configuration Syntax
      run: docker compose config

    - name: Build and Start Container Stack
      run: docker compose up --build -d

    - name: Verify Container Health Check Status
      run: |
        sleep 10
        docker ps -a
